<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>💰 Expense Tracker</h1>

        <div class="form-grid">
          <div class="input-group">
            <label>Expense Name</label>

            <input type="text" id="name" placeholder="Enter expense name" />
          </div>

          <div class="input-group">
            <label>Amount</label>

            <input type="number" id="amount" placeholder="Enter amount" />
          </div>

          <div class="input-group">
            <label>Category</label>

            <select id="category">
              <option>Food</option>
              <option>Travel</option>
              <option>Shopping</option>
              <option>Bills</option>
              <option>Other</option>
            </select>
          </div>

          <div class="input-group">
            <label>Date</label>

            <input type="date" id="date" />
          </div>
        </div>

        <button id="addBtn" onclick="addExpense()">Add Expense</button>

        <div class="summary">
          <div class="total-box">
            <h2>Total Expense</h2>

            <h3>₹ <span id="total">0</span></h3>
          </div>
        </div>

        <div class="toolbar">
          <input type="text" id="search" placeholder="🔍 Search expense..." />

          <select id="filter">
            <option value="All">All Categories</option>

            <option value="Food">Food</option>

            <option value="Travel">Travel</option>

            <option value="Shopping">Shopping</option>

            <option value="Bills">Bills</option>

            <option value="Other">Other</option>
          </select>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>

                <th>Amount</th>

                <th>Category</th>

                <th>Date</th>

                <th>Action</th>
              </tr>
            </thead>

            <tbody id="tbody"></tbody>
          </table>

          <div id="empty" class="empty">No expenses added.</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
