<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Expense tracker</h1>
    <h3>Expense Name</h3>
    <input type="text" id="n" />
    <h3>Amount</h3>
    <input type="number" id="a" />
    <h3>Category</h3>
    <select id="c">
      <option>Food</option>
      <option>Shopping</option>
      <option>Travelling</option>
      <option>Bills</option>
      <option>Others</option>
    </select>
    <h3>Date</h3>
    <input type="date" id="d" /> <br /><br />
    <button id="ae">Add Expense</button>
    <h3>Total Expense <span id="te">0</span></h3>
    <table border="1">
      <thead>
        <tr>
          <th>Name</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="td"></tbody>
    </table>
  </body>
  <script>
    let sum = 0; const n = document.getElementById("n"); const a = document.getElementById("a"); const c = document.getElementById("c"); const d = document.getElementById("d"); const ae = document.getElementById("ae"); const te = document.getElementById("te"); const td = document.getElementById("td"); ae.addEventListener("click", () => { const tr = document.createElement("tr"); const td1 = document.createElement("td"); const td2 = document.createElement("td"); const td3 = document.createElement("td"); const td4 = document.createElement("td"); const td5 = document.createElement("td"); const b2 = document.createElement("button"); b2.textContent = "delete"; b2.addEventListener("click", () => { tr.remove(); sum = sum - amount; te.textContent = sum; }); const b3 = document.createElement("button"); b3.textContent = "edit"; b3.addEventListener("click",()=>{ n.value=td1.textContent a.value=td2.textContent c.value=td3.textContent d.value=td4.textContent }) td5.appendChild(b3); td5.appendChild(b2); let amount = parseInt(a.value); sum = sum + amount; te.textContent = sum; td1.textContent = n.value; td2.textContent = a.value; td3.textContent = c.value; td4.textContent = d.value; tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4); tr.appendChild(td5); td.appendChild(tr); n.value = ""; a.value = ""; c.value = ""; d.value = ""; });
  </script>
</html>
